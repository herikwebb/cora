# Repository-local example: copy to .cora/config.toml.
base = "upstream/main"
reviewer_timeout = "15m"
overall_timeout = "45m"
require_clean_tree = true
allow_api_billing = false
# Host checks can read the local filesystem and use the network. Leave this
# false unless every reviewed change is trusted and the risk is understood.
allow_unsafe_host_checks = false
minimum_approvals = 2
blocking_severities = ["blocker", "major"]

[reviewers.codex]
enabled = true
command = "codex"
model = "gpt-5.6"
effort = "high"

[reviewers.claude]
enabled = true
command = "claude"
model = "opus"
effort = "high"
max_turns = 50

# Security-sensitive changes use this Claude model. A completed disagreement
# between the ordinary reviewers also starts a separate adjudication with it.
[escalation]
enabled = true
model = "fable"
effort = "high"
security_path_markers = [
  "/.cora/", "/.codex/", "/.claude/", "/.github/workflows/",
  "/auth/", "/authentication/", "/authorization/", "/security/",
  "/crypto/", "/cryptography/", "/iam/", "/permissions/",
  "/secrets/", "/credentials/", "oauth", "jwt",
]

[[checks]]
name = "unit"
command = ["go", "test", "./..."]
timeout = "10m"
# Only these parent environment variables are added to CORA's minimal check
# environment. Values are never configured here.
env_allowlist = []
