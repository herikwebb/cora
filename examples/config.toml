# Repository-local example: copy to .cora/config.toml.
base = "upstream/main"
reviewer_timeout = "15m"
overall_timeout = "45m"
queue_timeout = "24h"
strict = false
# Require an adversarial source-to-sink trace before a sole-reviewer blocker or
# major can determine the final verdict.
cross_examine_blocking_findings = true
require_clean_tree = true
allow_api_billing = false
# Host checks can read the local filesystem and use the network. Leave this
# false unless every reviewed change is trusted and the risk is understood.
allow_unsafe_host_checks = false
minimum_approvals = 2
blocking_severities = ["blocker", "major"]

[reviewers.codex]
enabled = true
command = "codex"
model = "gpt-5.6-sol"
effort = "high"
max_concurrency = 2

[reviewers.claude]
enabled = true
command = "claude"
model = "opus"
effort = "high"
max_turns = 50
finalization_turns = 2
# Optional hard ceiling passed to Claude Code; 0 disables it.
max_budget_usd = 0
max_concurrency = 1

# Security-sensitive changes and targeted cross-examination use this Claude
# model. Set broad adjudication to true only when its additional provider usage
# is intentional.
[escalation]
enabled = true
model = "fable"
effort = "high"
# Optional per-escalation overrides. Omit either value to inherit it from
# [reviewers.claude]. Set max_budget_usd to 0 to disable the inherited ceiling.
# max_turns = 40
# max_budget_usd = 6
adjudicate_disagreements = false
security_path_markers = [
  "/.cora/", "/.codex/", "/.claude/", "/.github/workflows/",
  "/auth/", "/authentication/", "/authorization/", "/security/",
  "/crypto/", "/cryptography/", "/iam/", "/permissions/",
  "/secrets/", "/credentials/", "oauth", "jwt",
]

# Auto-fix remains disabled unless `cora review --auto-fix` is passed. These
# values configure the write-enabled Codex agent and its cumulative loop limits.
[auto_fix]
command = "codex"
model = "gpt-5.6-sol"
effort = "high"
until = "major"
agent_timeout = "20m"
max_duration = "1h"
max_iterations = 5
max_turns = 250
max_cost_usd = 50
max_concurrency = 1

[[checks]]
name = "unit"
command = ["go", "test", "./..."]
timeout = "10m"
# Only these parent environment variables are added to CORA's minimal check
# environment. Values are never configured here.
env_allowlist = []

# Select this with `cora review --profile go-fast --allow-unsafe-checks`.
[[validation_profiles]]
name = "go-fast"

[[validation_profiles.checks]]
name = "go-test"
command = ["go", "test", "./..."]
timeout = "15m"
env_allowlist = []
